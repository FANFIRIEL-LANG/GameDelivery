name: Tests
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app core integrations games notifications tests
      - name: Test Steam trade credential storage and migration
        run: timeout 90s python -m unittest discover -s tests -p test_trade_credentials.py -v
      - name: Test complete Steam trade UI flow
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 120s python -m unittest discover -s tests -p test_trade_delivery_ui.py -v
      - name: Run full unit test suite
        id: full-suite
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          ulimit -c 0
          set +e
          timeout 180s python -m unittest discover -s tests -v > "$RUNNER_TEMP/full-suite.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/full-suite.log"
          if [ "$result" -eq 139 ] \
            && grep -Eq '^Ran [0-9]+ tests in ' "$RUNNER_TEMP/full-suite.log" \
            && grep -qx 'OK' "$RUNNER_TEMP/full-suite.log"; then
            touch "$RUNNER_TEMP/full-suite-needs-isolation"
            echo "qt_shutdown_exit=139" >> "$GITHUB_OUTPUT"
            echo "::warning::All unit-test assertions passed; Python/Qt segfaulted only during process shutdown. Every test module will be verified in isolation."
            exit 0
          fi
          if [ "$result" -eq 134 ] \
            && grep -Eq '^Ran [0-9]+ tests in ' "$RUNNER_TEMP/full-suite.log" \
            && grep -qx 'OK' "$RUNNER_TEMP/full-suite.log" \
            && grep -q '^pure virtual method called$' "$RUNNER_TEMP/full-suite.log"; then
            touch "$RUNNER_TEMP/full-suite-needs-isolation"
            echo "qt_shutdown_abort=134" >> "$GITHUB_OUTPUT"
            echo "::warning::All unit-test assertions passed; Python/Qt aborted during pure-virtual shutdown. Every test module will be verified in isolation."
            exit 0
          fi
          if [ "$result" -ne 0 ]; then
            touch "$RUNNER_TEMP/full-suite-needs-isolation"
          fi
          exit "$result"
      - name: Isolate test modules after full-suite failure or Qt shutdown crash
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ ! -f "$RUNNER_TEMP/full-suite-needs-isolation" ]; then
            echo "Full suite passed without shutdown crash; isolated diagnostic is not required."
            exit 0
          fi
          failures=0
          for test_file in tests/test_*.py; do
            test_name=$(basename "$test_file")
            module_log="$RUNNER_TEMP/$test_name.log"
            echo "::group::Isolated $test_name"
            set +e
            timeout 45s python -m unittest discover -s tests -p "$test_name" -v > "$module_log" 2>&1
            result=$?
            set -e
            cat "$module_log"
            if [ "$result" -eq 0 ]; then
              :
            elif [ "$result" -eq 139 ] \
              && grep -Eq '^Ran [0-9]+ tests in ' "$module_log" \
              && grep -qx 'OK' "$module_log"; then
              echo "::warning::$test_name assertions passed; Qt segfaulted only during process shutdown."
            elif [ "$result" -eq 134 ] \
              && grep -Eq '^Ran [0-9]+ tests in ' "$module_log" \
              && grep -qx 'OK' "$module_log" \
              && grep -q '^pure virtual method called
 "$module_log"; then
              echo "::warning::$test_name assertions passed; Qt aborted only during pure-virtual shutdown."
            else
              echo "::error::Isolated test module failed: $test_name (exit $result)"
              failures=1
            fi
            echo "::endgroup::"
          done
          exit "$failures"
