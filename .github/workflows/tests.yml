name: Tests
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app core integrations games notifications tests
      - name: Test Steam trade credential storage and migration
        run: timeout 90s python -m unittest discover -s tests -p test_trade_credentials.py -v
      - name: Test complete Steam trade UI flow
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 120s python -m unittest discover -s tests -p test_trade_delivery_ui.py -v
      - name: Run full unit test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 180s python -m unittest discover -s tests -v
      - name: Isolate test modules after full-suite failure
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          failures=0
          for test_file in tests/test_*.py; do
            test_name=$(basename "$test_file")
            echo "::group::Isolated $test_name"
            if ! timeout 45s python -m unittest discover -s tests -p "$test_name" -v; then
              echo "::error::Isolated test module failed: $test_name"
              failures=1
            fi
            echo "::endgroup::"
          done
          exit "$failures"
