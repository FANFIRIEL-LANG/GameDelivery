name: ASF plugin — stable 6.3.10.6

on:
  pull_request:
    paths:
      - integrations/asf_plugin/**
      - integrations/asf/client.py
      - app/main.py
      - tests/test_asf_client.py
      - .github/workflows/asf-plugin.yml
  push:
    branches:
      - feature/asf-bulk-account-import
    paths:
      - integrations/asf_plugin/**
      - integrations/asf/client.py
      - app/main.py
      - tests/test_asf_client.py
      - .github/workflows/asf-plugin.yml
      - integrations/asf_plugin/README.md

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GameDelivery
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download official ASF 6.3.10.6 release binaries
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://sourceforge.net/projects/archisteamfarm.mirror/files/6.3.10.6/ASF-generic.zip/download \
            --output /tmp/ASF-generic.zip
          echo "118f9bb85d2d8d301536e96d304cbe8e7aa99a6aa1d1bb97a540e78b7c73b1ce  /tmp/ASF-generic.zip" | sha256sum --check
          mkdir -p .asf-bin
          unzip -q /tmp/ASF-generic.zip -d .asf-bin
          test -s .asf-bin/ArchiSteamFarm.dll
          test -s .asf-bin/SteamKit2.dll

      - name: Build GameDelivery ASF plugin against the exact release assemblies
        run: dotnet build integrations/asf_plugin/GameDelivery.ASFPlugin.csproj --configuration Release -p:ASF_BIN_DIR=$GITHUB_WORKSPACE/.asf-bin

      - name: Prepare installable plugin package
        shell: bash
        run: |
          set -euo pipefail
          plugin_dll=integrations/asf_plugin/bin/Release/net10.0/GameDelivery.ASFPlugin.dll
          test -s "$plugin_dll"
          mkdir -p dist/GameDelivery.ASFPlugin
          cp "$plugin_dll" dist/GameDelivery.ASFPlugin/GameDelivery.ASFPlugin.dll
          cp integrations/asf_plugin/README.md dist/GameDelivery.ASFPlugin/README.md
          printf 'GameDelivery ASF plugin\nGameDelivery commit: %s\nASF source contract: %s\nModes: live preview and explicitly confirmed guarded trade sending\n' "$GITHUB_SHA" "official ASF 6.3.10.6 ASF-generic.zip SHA256 118f9bb85d2d8d301536e96d304cbe8e7aa99a6aa1d1bb97a540e78b7c73b1ce" > dist/GameDelivery.ASFPlugin/BUILD_INFO.txt

      - name: Upload installable plugin package
        uses: actions/upload-artifact@v4
        with:
          name: GameDelivery-ASFPlugin
          path: dist/
          if-no-files-found: error
          retention-days: 30
