name: ASF plugin

on:
  pull_request:
    paths:
      - integrations/asf_plugin/**
      - integrations/asf/client.py
      - app/main.py
      - tests/test_asf_client.py
      - .github/workflows/asf-plugin.yml
  push:
    branches:
      - feature/steam-card-set-selection
    paths:
      - integrations/asf_plugin/**
      - integrations/asf/client.py
      - app/main.py
      - tests/test_asf_client.py
      - .github/workflows/asf-plugin.yml

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GameDelivery
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Checkout matching ASF source contract
        uses: actions/checkout@v4
        with:
          repository: JustArchiNET/ArchiSteamFarm
          ref: 06d6109ed781740bf5e9e20bc9bb588ec8a1c879
          path: .asf-src

      - name: Build ASF API assemblies
        run: dotnet build .asf-src/ArchiSteamFarm/ArchiSteamFarm.csproj --configuration Release

      - name: Build GameDelivery ASF plugin
        run: dotnet build integrations/asf_plugin/GameDelivery.ASFPlugin.csproj --configuration Release -p:ASF_BIN_DIR=$GITHUB_WORKSPACE/.asf-src/ArchiSteamFarm/bin/Release/net10.0

      - name: Prepare installable plugin package
        shell: bash
        run: |
          set -euo pipefail
          plugin_dll=integrations/asf_plugin/bin/Release/net10.0/GameDelivery.ASFPlugin.dll
          test -s "$plugin_dll"
          mkdir -p dist/GameDelivery.ASFPlugin
          cp "$plugin_dll" dist/GameDelivery.ASFPlugin/GameDelivery.ASFPlugin.dll
          cp integrations/asf_plugin/README.md dist/GameDelivery.ASFPlugin/README.md
          printf 'GameDelivery ASF plugin\nGameDelivery commit: %s\nASF source contract: %s\nMode: preview-only; trade sending disabled\n' "$GITHUB_SHA" "06d6109ed781740bf5e9e20bc9bb588ec8a1c879" > dist/GameDelivery.ASFPlugin/BUILD_INFO.txt

      - name: Upload installable plugin package
        uses: actions/upload-artifact@v4
        with:
          name: GameDelivery-ASFPlugin-preview-only
          path: dist/GameDelivery.ASFPlugin/
          if-no-files-found: error
          retention-days: 30
