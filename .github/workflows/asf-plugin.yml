name: ASF plugin — ASF 6.3.11.7

on:
  pull_request:
    paths:
      - integrations/asf_plugin/**
      - integrations/asf/client.py
      - app/main.py
      - tests/test_asf_client.py
      - .github/workflows/asf-plugin.yml
  push:
    branches:
      - feature/asf-bulk-account-import
    paths:
      - integrations/asf_plugin/**
      - integrations/asf/client.py
      - app/main.py
      - tests/test_asf_client.py
      - .github/workflows/asf-plugin.yml
      - integrations/asf_plugin/README.md

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GameDelivery
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download and verify official ASF 6.3.11.7 release binaries
        shell: bash
        run: |
          set -euo pipefail
          base=https://sourceforge.net/projects/archisteamfarm.mirror/files/6.3.11.7
          curl --fail --location --retry 3 "$base/ASF-generic.zip/download" --output /tmp/ASF-generic.zip
          curl --fail --location --retry 3 "$base/SHA512SUMS/download" --output /tmp/ASF-SHA512SUMS
          awk '$2 == "ASF-generic.zip" || $2 == "*ASF-generic.zip" { print $1 "  /tmp/ASF-generic.zip"; found=1 } END { exit !found }' /tmp/ASF-SHA512SUMS > /tmp/ASF-generic.sha512
          test -s /tmp/ASF-generic.sha512
          sha512sum --check /tmp/ASF-generic.sha512
          mkdir -p .asf-bin
          unzip -q /tmp/ASF-generic.zip -d .asf-bin
          test -s .asf-bin/ArchiSteamFarm.dll
          test -s .asf-bin/SteamKit2.dll

      - name: Build GameDelivery ASF plugin against the exact release assemblies
        run: dotnet build integrations/asf_plugin/GameDelivery.ASFPlugin.csproj --configuration Release -p:ASF_BIN_DIR=$GITHUB_WORKSPACE/.asf-bin

      - name: Prepare installable plugin package
        shell: bash
        run: |
          set -euo pipefail
          plugin_dll=integrations/asf_plugin/bin/Release/net10.0/GameDelivery.ASFPlugin.dll
          test -s "$plugin_dll"
          mkdir -p dist/GameDelivery.ASFPlugin
          cp "$plugin_dll" dist/GameDelivery.ASFPlugin/GameDelivery.ASFPlugin.dll
          json_dll=integrations/asf_plugin/bin/Release/net10.0/Newtonsoft.Json.dll
          test -s "$json_dll"
          cp "$json_dll" dist/GameDelivery.ASFPlugin/Newtonsoft.Json.dll
          cp integrations/asf_plugin/README.md dist/GameDelivery.ASFPlugin/README.md
          printf 'GameDelivery ASF plugin\nGameDelivery commit: %s\nASF source contract: %s\nModes: live preview and explicitly confirmed guarded trade sending\n' "$GITHUB_SHA" "official ASF 6.3.11.7 ASF-generic.zip verified against its release SHA512SUMS manifest" > dist/GameDelivery.ASFPlugin/BUILD_INFO.txt

      - name: Upload installable plugin package
        uses: actions/upload-artifact@v4
        with:
          name: GameDelivery-ASFPlugin
          path: dist/
          if-no-files-found: error
          retention-days: 30
