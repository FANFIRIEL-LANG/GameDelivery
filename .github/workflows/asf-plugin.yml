name: ASF plugin — ASF 6.3.11.7

on:
  workflow_dispatch:
  pull_request:
    paths:
      - integrations/asf_plugin/**
      - integrations/asf/client.py
      - app/main.py
      - tests/test_asf_client.py
      - tests/test_asf_plugin_contract.py
      - integrations/asf_plugin/README.md
      - .github/workflows/asf-plugin.yml
  push:
    branches:
      - feature/asf-bulk-account-import
    paths:
      - integrations/asf_plugin/**
      - integrations/asf/client.py
      - app/main.py
      - tests/test_asf_client.py
      - tests/test_asf_plugin_contract.py
      - integrations/asf_plugin/README.md
      - .github/workflows/asf-plugin.yml

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GameDelivery
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download and verify official ASF 6.3.11.7 release binaries
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/JustArchiNET/ArchiSteamFarm/releases/download/6.3.11.7
          curl --fail --location --retry 3 "$base/ASF-generic.zip" --output /tmp/ASF-generic.zip
          echo "cb3ddb9bd10560458a460664c9af6186e124e89801d118197a82eef5a9315ceb  /tmp/ASF-generic.zip" | sha256sum --check
          mkdir -p .asf-bin
          unzip -q /tmp/ASF-generic.zip -d .asf-bin
          echo "ASF generic archive assembly layout:"
          find .asf-bin -type f \( -name ArchiSteamFarm.dll -o -name SteamKit2.dll -o -name System.Composition.AttributedModel.dll \) -print
          asf_bin_dir=$(dirname "$(find .asf-bin -type f -name ArchiSteamFarm.dll -print -quit)")
          test -n "$asf_bin_dir"
          test -s "$asf_bin_dir/SteamKit2.dll"
          test -s "$asf_bin_dir/System.Composition.AttributedModel.dll"
          echo "ASF_BIN_DIR=$GITHUB_WORKSPACE/$asf_bin_dir" >> "$GITHUB_ENV"

      - name: Build GameDelivery ASF plugin against exact host assemblies
        run: dotnet build integrations/asf_plugin/GameDelivery.ASFPlugin.csproj --configuration Release -p:ASF_BIN_DIR=$ASF_BIN_DIR

      - name: Verify plugin has no Newtonsoft runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'Newtonsoft.Json\|JsonConvert\|JsonSerializationException' integrations/asf_plugin --include='*.cs' --include='*.csproj'; then
            echo "Unexpected Newtonsoft.Json usage in ASF plugin source" >&2
            exit 1
          fi

      - name: Verify plugin output does not contain host-shared dependencies
        shell: bash
        run: |
          set -euo pipefail
          output=integrations/asf_plugin/bin/Release/net10.0
          test -s "$output/GameDelivery.ASFPlugin.dll"
          for shared in ArchiSteamFarm.dll SteamKit2.dll System.Composition.AttributedModel.dll; do
            if test -e "$output/$shared"; then
              echo "Unexpected host-shared dependency in plugin output: $shared" >&2
              exit 1
            fi
          done

      - name: Prepare installable plugin package
        shell: bash
        run: |
          set -euo pipefail
          plugin_dll=integrations/asf_plugin/bin/Release/net10.0/GameDelivery.ASFPlugin.dll
          test -s "$plugin_dll"
          mkdir -p dist/GameDelivery.ASFPlugin
          cp "$plugin_dll" dist/GameDelivery.ASFPlugin/GameDelivery.ASFPlugin.dll
          cp integrations/asf_plugin/README.md dist/GameDelivery.ASFPlugin/README.md
          {
            printf 'GameDelivery ASF plugin\n'
            printf 'GameDelivery commit: %s\n' "$GITHUB_SHA"
            printf 'ASF source contract: official ASF 6.3.11.7 release binaries\n'
            printf 'Modes: live preview and explicitly confirmed guarded trade sending\n'
          } > dist/GameDelivery.ASFPlugin/BUILD_INFO.txt
          test "$(find dist/GameDelivery.ASFPlugin -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Upload installable plugin package
        uses: actions/upload-artifact@v4
        with:
          name: GameDelivery-ASFPlugin
          path: dist/
          if-no-files-found: error
          retention-days: 30
