name: Build GameDelivery Windows executable

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/steam-card-set-selection
    paths:
      - app/**
      - core/**
      - games/**
      - integrations/**
      - notifications/**
      - tests/**
      - requirements.txt
      - .github/workflows/package-windows.yml
  push:
    branches:
      - feature/steam-card-set-selection
    paths:
      - app/**
      - core/**
      - games/**
      - integrations/**
      - notifications/**
      - tests/**
      - requirements.txt
      - .github/workflows/package-windows.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout GameDelivery
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compile Python files
        run: python -m compileall -q app core integrations games notifications tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build Windows GUI executable
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir --name GameDelivery
          --collect-all PySide6 --collect-all keyring --copy-metadata keyring
          --collect-submodules app --collect-submodules core --collect-submodules games
          --collect-submodules integrations --collect-submodules notifications
          app\__main__.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          .\dist\GameDelivery\GameDelivery.exe --self-test

      - name: Add package instructions
        shell: pwsh
        run: |
          @'
          GameDelivery — Windows x64
          Start the application with GameDelivery.exe.
          The local database is stored in %USERPROFILE%\.gamedelivery\gamedelivery.sqlite3.
          The application is packaged with its Python and Qt runtime dependencies.
          ASF must be installed and running separately for ASF-based inventory functions.
          The ASF preview plugin is a separate component and must match the installed ASF version.
          Real Steam trade sending is disabled.
          '@ | Set-Content -Encoding utf8 dist\GameDelivery\PACKAGE_README.txt

      - name: Create distributable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\GameDelivery -DestinationPath dist\GameDelivery-Windows-x64.zip -Force

      - name: Upload Windows executable package
        uses: actions/upload-artifact@v4
        with:
          name: GameDelivery-Windows-x64
          path: dist/GameDelivery-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
