name: Build custom ASF Generic (no trade-offer signature)

on:
  workflow_dispatch:
  push:
    branches:
      - work/local-sync
    paths:
      - '.github/workflows/asf-custom-generic.yml'
      - 'integrations/asf_patch/**'
      - 'integrations/asf_plugin/**'
      - 'tests/asf_plugin_smoke/**'

permissions:
  contents: read

jobs:
  build-custom-asf:
    runs-on: windows-latest
    steps:
      - name: Checkout GameDelivery
        uses: actions/checkout@v4

      - name: Checkout official ASF 6.3.11.7 source
        uses: actions/checkout@v4
        with:
          repository: JustArchiNET/ArchiSteamFarm
          ref: 6.3.11.7
          path: asf-source

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply the single-purpose signature patch and verify source
        shell: pwsh
        run: |
          $source = Join-Path $PWD "asf-source/ArchiSteamFarm/Steam/Integration/ArchiWebHandler.cs"
          $patch = Join-Path $PWD "integrations/asf_patch/remove-trade-offer-signature.patch"
          $old = 'string tradeOfferMessage = $"Sent by {SharedInfo.PublicIdentifier}/{SharedInfo.Version}";'
          $new = 'string tradeOfferMessage = string.Empty;'
          $patchText = Get-Content -LiteralPath $patch -Raw
          if (!$patchText.Contains($old) -or !$patchText.Contains($new)) {
            throw "Signature patch reference does not describe the expected one-line replacement."
          }

          # Replace the exact UTF-8 byte sequence, preserving every other source byte and any BOM.
          $sourceBytes = [System.IO.File]::ReadAllBytes($source)
          $oldBytes = [System.Text.Encoding]::UTF8.GetBytes($old)
          $newBytes = [System.Text.Encoding]::UTF8.GetBytes($new)
          $matches = [System.Collections.Generic.List[int]]::new()
          for ($i = 0; $i -le $sourceBytes.Length - $oldBytes.Length; $i++) {
            $match = $true
            for ($j = 0; $j -lt $oldBytes.Length; $j++) {
              if ($sourceBytes[$i + $j] -ne $oldBytes[$j]) { $match = $false; break }
            }
            if ($match) { $matches.Add($i) }
          }
          if ($matches.Count -ne 1) {
            throw "Expected exactly one original ASF signature assignment; found $($matches.Count)."
          }

          $position = $matches[0]
          $output = [byte[]]::new($sourceBytes.Length - $oldBytes.Length + $newBytes.Length)
          [Array]::Copy($sourceBytes, 0, $output, 0, $position)
          [Array]::Copy($newBytes, 0, $output, $position, $newBytes.Length)
          $tailStart = $position + $oldBytes.Length
          $tailLength = $sourceBytes.Length - $tailStart
          [Array]::Copy($sourceBytes, $tailStart, $output, $position + $newBytes.Length, $tailLength)
          [System.IO.File]::WriteAllBytes($source, $output)

          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($source))
          if (!$text.Contains($new) -or $text.Contains($old)) {
            throw "ASF trade-offer message replacement verification failed."
          }
          git -C asf-source diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched ASF source has whitespace errors." }
          $change = git -C asf-source diff --numstat -- ArchiSteamFarm/Steam/Integration/ArchiWebHandler.cs
          if ($LASTEXITCODE -ne 0 -or $change -notmatch '^1\s+1\s+ArchiSteamFarm/Steam/Integration/ArchiWebHandler\.cs
      - name: Publish patched ASF Generic
        shell: pwsh
        run: |
          dotnet publish asf-source/ArchiSteamFarm/ArchiSteamFarm.csproj --configuration Release --output "$PWD/dist/ASF-generic" -p:PublishTrimmed=false -p:SelfContained=false
          if (!(Test-Path "dist/ASF-generic/ArchiSteamFarm.dll")) {
            throw "Patched ASF Generic publish did not produce ArchiSteamFarm.dll."
          }

      - name: Build GameDelivery plugin against the patched ASF host
        shell: pwsh
        run: |
          $asfBin = (Resolve-Path "dist/ASF-generic").Path
          dotnet build integrations/asf_plugin/GameDelivery.ASFPlugin.csproj --configuration Release -p:ASF_BIN_DIR="$asfBin"
          $plugin = "integrations/asf_plugin/bin/Release/net10.0/GameDelivery.ASFPlugin.dll"
          if (!(Test-Path $plugin)) {
            throw "GameDelivery ASF plugin build output is missing."
          }
          $pluginDir = "dist/ASF-generic/plugins/GameDelivery.ASFPlugin"
          New-Item -ItemType Directory -Path $pluginDir -Force | Out-Null
          Copy-Item $plugin (Join-Path $pluginDir "GameDelivery.ASFPlugin.dll") -Force

      - name: Smoke test plugin against patched ASF host assemblies
        shell: pwsh
        run: |
          $asfBin = (Resolve-Path "dist/ASF-generic").Path
          $plugin = (Resolve-Path "dist/ASF-generic/plugins/GameDelivery.ASFPlugin/GameDelivery.ASFPlugin.dll").Path
          dotnet run --project tests/asf_plugin_smoke/ASFPlugin.Smoke.csproj --configuration Release -p:ASF_BIN_DIR="$asfBin" -p:PLUGIN_DLL="$plugin"

      - name: Record build provenance and package
        shell: pwsh
        run: |
          @(
            "GameDelivery custom ASF Generic"
            "Upstream: JustArchiNET/ArchiSteamFarm tag 6.3.11.7"
            "Patch: integrations/asf_patch/remove-trade-offer-signature.patch"
            "Change: Steam trade-offer message is an empty string; standard ASF signature and custom suffix are both omitted."
            "GameDelivery commit: $env:GITHUB_SHA"
            "No Steam credentials, bots, IPC commands, or real trade offers were used during this build."
          ) | Set-Content -LiteralPath "dist/ASF-generic/BUILD_INFO.txt" -Encoding utf8
          Compress-Archive -Path "dist/ASF-generic/*" -DestinationPath "dist/GameDelivery-ASF-Generic.zip" -Force

      - name: Upload custom ASF Generic artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDelivery-ASF-Generic
          path: dist/GameDelivery-ASF-Generic.zip
          if-no-files-found: error
          retention-days: 30
) {
            throw "Expected exactly one insertion and one deletion in ArchiWebHandler.cs; got: $change"
          }
          Write-Host "Verified: exactly one ASF signature assignment changed; all other source bytes remain unchanged."

      - name: Publish patched ASF Generic
        shell: pwsh
        run: |
          dotnet publish asf-source/ArchiSteamFarm/ArchiSteamFarm.csproj --configuration Release --output "$PWD/dist/ASF-generic" -p:PublishTrimmed=false -p:SelfContained=false
          if (!(Test-Path "dist/ASF-generic/ArchiSteamFarm.dll")) {
            throw "Patched ASF Generic publish did not produce ArchiSteamFarm.dll."
          }

      - name: Build GameDelivery plugin against the patched ASF host
        shell: pwsh
        run: |
          $asfBin = (Resolve-Path "dist/ASF-generic").Path
          dotnet build integrations/asf_plugin/GameDelivery.ASFPlugin.csproj --configuration Release -p:ASF_BIN_DIR="$asfBin"
          $plugin = "integrations/asf_plugin/bin/Release/net10.0/GameDelivery.ASFPlugin.dll"
          if (!(Test-Path $plugin)) {
            throw "GameDelivery ASF plugin build output is missing."
          }
          $pluginDir = "dist/ASF-generic/plugins/GameDelivery.ASFPlugin"
          New-Item -ItemType Directory -Path $pluginDir -Force | Out-Null
          Copy-Item $plugin (Join-Path $pluginDir "GameDelivery.ASFPlugin.dll") -Force

      - name: Smoke test plugin against patched ASF host assemblies
        shell: pwsh
        run: |
          $asfBin = (Resolve-Path "dist/ASF-generic").Path
          $plugin = (Resolve-Path "dist/ASF-generic/plugins/GameDelivery.ASFPlugin/GameDelivery.ASFPlugin.dll").Path
          dotnet run --project tests/asf_plugin_smoke/ASFPlugin.Smoke.csproj --configuration Release -p:ASF_BIN_DIR="$asfBin" -p:PLUGIN_DLL="$plugin"

      - name: Record build provenance and package
        shell: pwsh
        run: |
          @(
            "GameDelivery custom ASF Generic"
            "Upstream: JustArchiNET/ArchiSteamFarm tag 6.3.11.7"
            "Patch: integrations/asf_patch/remove-trade-offer-signature.patch"
            "Change: Steam trade-offer message is an empty string; standard ASF signature and custom suffix are both omitted."
            "GameDelivery commit: $env:GITHUB_SHA"
            "No Steam credentials, bots, IPC commands, or real trade offers were used during this build."
          ) | Set-Content -LiteralPath "dist/ASF-generic/BUILD_INFO.txt" -Encoding utf8
          Compress-Archive -Path "dist/ASF-generic/*" -DestinationPath "dist/GameDelivery-ASF-Generic.zip" -Force

      - name: Upload custom ASF Generic artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDelivery-ASF-Generic
          path: dist/GameDelivery-ASF-Generic.zip
          if-no-files-found: error
          retention-days: 30
